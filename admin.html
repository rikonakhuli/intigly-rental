<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rental Map admin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar"><div class="brand">Rental Map admin</div>
    <div class="city-switch" role="group" aria-label="Queue">
      <button class="city-btn active" data-status="pending_approval">Pending approval</button>
      <button class="city-btn" data-status="live">Live</button>
      <button class="city-btn" data-status="rejected">Rejected</button>
    </div>
  </header>
  <main class="admin-wrap">
    <div id="adminMsg" class="muted small"></div>
    <div id="adminLogin" class="admin-login" hidden>
      <h2>Admin log in</h2>
      <form id="adminLoginForm">
        <label>Email <input name="email" type="email" required /></label>
        <label>Password <input name="password" type="password" required /></label>
        <button class="btn primary wide" type="submit">Log in</button>
      </form>
    </div>
    <div id="adminList"></div>
  </main>
  <script src="admin.js"></script>
</body>
</html>
